name: integration-test-poc

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'sonarqube-webapp-addons/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'scripts/integration-test.sh'
      - '.github/workflows/integration-test.yml'

jobs:
  integration-test:
    name: SonarQube plugin smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Run integration smoke test
        run: bash scripts/integration-test.sh
